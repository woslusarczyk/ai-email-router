services:
  ollama:
    build:
      context: ./ollama
    environment:
      MODEL_NAME: ${MODEL_NAME:-llama3.2}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$$MODEL_NAME\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-llama3.2}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      ollama:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  ollama_data:
